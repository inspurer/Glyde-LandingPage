services:
  web:
    container_name: glyde-landing-page
    build:
      context: .
      dockerfile: Dockerfile
    image: glyde-landing-page:latest
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      SHOPIFY_STORE_DOMAIN: "${SHOPIFY_STORE_DOMAIN:-drhrvj-70.myshopify.com}"
      SHOPIFY_API_VERSION: "${SHOPIFY_API_VERSION:-2026-07}"
      SHOPIFY_ADMIN_ACCESS_TOKEN: "${SHOPIFY_ADMIN_ACCESS_TOKEN:-}"
      # Runtime switch for the .online reservation button. Shopify mode uses
      # a dedicated $5 variant and leaves the existing .com product untouched.
      CHECKOUT_PROVIDER: "${CHECKOUT_PROVIDER:-disabled}"
      SHOPIFY_CHECKOUT_STORE_DOMAIN: "${SHOPIFY_CHECKOUT_STORE_DOMAIN:-}"
      SHOPIFY_DEPOSIT_VARIANT_ID: "${SHOPIFY_DEPOSIT_VARIANT_ID:-}"
      # PayPal Client ID is intentionally delivered to the browser by dynamic
      # SSR. The secret, webhook id and merchant id remain server-only.
      PAYPAL_ENVIRONMENT: "${PAYPAL_ENVIRONMENT:-sandbox}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-}"
      PAYPAL_MERCHANT_ID: "${PAYPAL_MERCHANT_ID:-}"
      # Production is fail-closed unless this is explicitly true. Set false to
      # stop new orders while capture/webhook handling remains available.
      PAYPAL_ACCEPT_NEW_ORDERS: "${PAYPAL_ACCEPT_NEW_ORDERS:-}"
      CHECKOUT_ORIGIN: "${CHECKOUT_ORIGIN:-https://glydeclipper.online}"
      GLYDE_DATA_DIR: /data
      # Required to open /admin. Must be at least 16 characters or the admin
      # page refuses to sign anyone in rather than pretend to be protected.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    # Bound to the loopback interface only. A reverse proxy (Caddy) terminates
    # TLS and is the sole public entry point; publishing on 0.0.0.0 would also
    # expose the app over plain HTTP on this port and bypass it.
    ports:
      - "127.0.0.1:${GLYDE_HOST_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # Waitlist, analytics and the payment ledger. Named volume so a rebuild
      # replaces the image without discarding signups or transaction records.
      - glyde-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  glyde-data:
